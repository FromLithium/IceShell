#################### COMMAND HELP - START ####################

command.call.description = Calls a batch program.
command.call.value_file.description = The name of the batch file to call.

command.cd.description = Displays the name of or changes the current directory.
command.cd.value_destination.description = The destination to change the current directory to.

command.cls.description = Clears the screen.

command.copy.description = Copies one or more files to another location.
command.copy.option_f.description = If specified, the target file will be overwritten.

command.del.description = Deletes one or more files.
command.del.option_P.description = If specified, ask for confirmation before deleting each file.

command.dir.description = Displays a list of files and subdirectories in a directory.
command.dir.value_directory.description = Specifies the directory to list.
command.dir.option_d.description = Specifies the date format (y = year digit, M = month digit, d = day digit).
command.dir.option_t.description = Specifies the time format (H = hour digit, m = minute digit, s = second digit).
command.dir.option_h.description = Reveals hidden files.
command.dir.option_L.description = Uses lower-case.
command.dir.option_U.description = Uses upper-case.
command.dir.option_S.description = Uses short name (DOS-compatible file name) whenever available.

command.echo.description = Displays messages.
command.echo.value_message.description = The message to display.
command.echo.option_E.description = Expands (parses) the environment variable notations in the message.

command.exit.description = Quits the IceShell command interpreter.

command.find.description = Searches for a text string in the pipeline input.
command.find.value_keyword.description = The keyword to search for.

command.goto.description = Directs IceShell to a labelled line in a batch program.
command.goto.value_label.description = Specifies a text string used in the batch program as a label.

command.help.description = Provides Help information for IceShell commands.
command.help.value_command.description = Specifies the command to display help information for.

command.if.description = Checks for a condition.
command.if.value_matchType.description = Specifies the type of the value to check.
command.if.value_matchName.description = Specifies the name of the value to compare with, or the value (if the value does not have a name) to compare tomatchValue.
command.if.value_matchValue.description = Specifies the value to compare with, if the value is a named value.
command.if.option_I.description = In a string comparison, ignores upper and lower case differences.
command.if.option_U.description = Inverts the check result.

command.mem.description = Displays the amount of used and free memory in your system.

command.mkdir.description = Creates a directory.
command.mkdir.value_directory.description = Specifies the directory (or a tree of directories) to create.

command.mkfile.description = Creates a file.
command.mkfile.value_value.description = Specifies the file to create.

command.move.description = Moves or renames a file.
command.move.option_f.description = If specified, the target file will be overwritten.

command.prompt.description = Displays or changes the IceShell command prompt.
command.prompt.value_prompt.description = Specifies the prompt to change to. If unspecified, the command displays the current prompt.

command.rem.description = Records comments (remarks) in batch files.
command.rem.value_comment.description = The comment.

command.set.description = Displays, sets, or removes environment variables.
command.set.value_variable.description = Specifies the name of the environment variable to display, set or remove.
command.set.value_value.description = Specifies the value to set the environment variable value to.

command.start.description = Starts a file or program via the system shell.
command.start.value_target.description = Specifies the target file or executable.

command.type.description = Displays the contents of a text file.
command.type.value_file.description = Specifies the file to display the contents of.

command.ver.description = Displays the IceShell version.
command.ver.option_C.description = Displays copyright information.
command.ver.option_S.description = Displays system information.

command.vol.description = Displays a disk volume label and serial number.
command.vol.value_volume.description = Specifies the volume to display the volume label and serial number of.

###################### COMMAND HELP END ######################

