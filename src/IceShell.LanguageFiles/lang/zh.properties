#################### COMMAND HELP - START ####################

command.call.description = 调用一个批处理文件。
command.call.value_file.description = 欲调用的批处理文件名称。

command.cd.description = 显示或更改当前目录。
command.cd.value_destination.description = 欲更改当前目录为的目标目录。

command.clip.description = 将管道输入复制到系统剪贴板。

command.cls.description = 清屏。

command.copy.description = 复制一个或多个文件到指定位置。
command.copy.option_f.description = 指定是否覆盖目标文件。

command.date.description = 显示当前时间与日期。
command.date.option_B.description = 只输出时间与日期值本身。
command.date.option_O.description = 使用 ISO 8601 标准格式。
command.date.option_R.description = 使用 RFC 1123 标准格式。
command.date.option_U.description = 使用协调世界时（UTC）。

command.del.description = 删除一个或多个文件。
command.del.option_P.description = 指定是否在删除每个文件前确认。

command.dir.description = 列出目录中的文件与子目录。
command.dir.value_directory.description = 欲列出文件与子目录的目录。
command.dir.option_d.description = 指定时间格式（y = 一位年份数字，M = 一位月份数字，d = 一位日期数字）
command.dir.option_t.description = Specifies the time format (H = 一位小时数字，m = 一位分钟数字，s = 一位秒数字）
command.dir.option_h.description = 指定是否显示隐藏的文件。
command.dir.option_L.description = 指定全部文件名使用小写。
command.dir.option_U.description = 指定全部文件名使用大写。
command.dir.option_S.description = 当可用时，使用短文件名（即 DOS 兼容文件名）。

command.echo.description = 显示指定的信息。
command.echo.value_message.description = 欲显示的信息。
command.echo.option_P.description = 指定是否解析用户主目录指定符。

command.exit.description = 退出 IceShell 命令解释器。

command.find.description = 在管道输入内搜索一串文本。
command.find.value_keyword.description = 欲搜索的关键词。

command.goto.description = 将 IceShell 执行跳转到批处理文件中的指定标签。
command.goto.value_label.description = 欲跳转到的标签名。

command.help.description = 显示 IceShell 命令的帮助信息。
command.help.value_command.description = 欲获取帮助信息的命令名称。

command.if.description = 判定条件是否满足。
command.if.value_matchType.description = Specifies the type of the value to check.
command.if.value_matchName.description = Specifies the name of the value to compare with, or the value (if the value does not have a name) to compare tomatchValue.
command.if.value_matchValue.description = Specifies the value to compare with, if the value is a named value.
command.if.option_I.description = In a string comparison, ignores upper and lower case differences.
command.if.option_U.description = Inverts the check result.

command.mem.description = 显示计算机中已使用和总共可用的内存大小。

command.mkdir.description = 创建目录。
command.mkdir.value_directory.description = 欲创建的目录（或一整串目录）。

command.mkfile.description = 创建文件。
command.mkfile.value_value.description = 欲创建的文件。

command.move.description = 移动或重命名文件。
command.move.option_f.description = 指定是否覆盖目标文件。

command.prompt.description = 显示或更改 IceShell 命令提示。
command.prompt.value_prompt.description = 欲修改为的命令提示。如果未指定，则显示当前命令提示。

command.rem.description = 在批处理文件中用作注释。
command.rem.value_comment.description = 注释内容。

command.set.description = 显示、设置或移除环境变量。
command.set.value_variable.description = 欲显示、设置或移除的环境变量。
command.set.value_value.description = 欲将环境变量设置为的值。

command.start.description = 通过系统外壳程序启动一个程序或打开一个文件。
command.start.value_target.description = 欲启动或打开的程序或文件。

command.type.description = 显示文本文件的内容。
command.type.value_file.description = 欲显示内容的文本文件。

command.ver.description = 显示 IceShell 版本信息。
command.ver.option_C.description = 指定是否显示版权声明。
command.ver.option_S.description = 指定是否显示系统信息。

command.vol.description = 显示磁盘的卷标和序列号。
command.vol.value_volume.description = 欲显示卷标和序列号的卷。

