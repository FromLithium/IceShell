# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json: global.json
    - name: Restore dependencies
      run: dotnet restore src/IceShell.slnx
    # - name: Cake Build
    #   run: "./src/build-ci.sh --target CIBuild"
    - name: Build
      run: dotnet build src/IceShell.slnx --no-restore --property:VersionPrefix=72.72.${{ github.run_number }} --version-suffix cibuild --configuration Release
    - name: Test

      run: dotnet test --project src/IceShell.Tests/IceShell.Tests.csproj --no-build --verbosity normal -- --coverage --coverage-output-format cobertura
    - name: Package Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: IceShell-nightly
        path: src/IceShell/bin/Release/net*
        if-no-files-found: warn
